[theme]
# Primary accent color (Buttons, active tabs, sliders): Warm clay / coffee brown
primaryColor = "#A36B4E"

# Main background color (App body): Deep forest olive green
backgroundColor = "#26302A"

# Sidebar and container background color (Sidebar, cards): Soft, muted leaf/grass green
secondaryBackgroundColor = "#334037"

# Main text color (Headers, body text): Crisp, warm parchment cream
textColor = "#FFF5E6"

# Font family
font = "sans serif"
