[theme]
# Primary accent color (Buttons, active tabs, sliders): Soft dusty terracotta-clay
primaryColor = "#B57352"

# Main background color (App body): A deep, rich sage-olive that has a warm earthy undertone
backgroundColor = "#2F342E"

# Sidebar and container background color (Sidebar, cards): A warm, muted taupe-brown that bridges the olive smoothly
secondaryBackgroundColor = "#3D352F"

# Main text color (Headers, body text): Soft warm parchment cream
textColor = "#F5EBE1"

# Font family
font = "sans serif"
